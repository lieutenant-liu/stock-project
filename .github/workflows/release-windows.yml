name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 构建前端
      - name: Build Frontend
        working-directory: stock-frontend
        run: |
          npm ci
          npm run build
          cp -r dist/* ../stock-backend/web/

      # 交叉编译 Windows amd64
      - name: Build Go Binary (Windows)
        working-directory: stock-backend
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go build -ldflags="-s -w" -o stock-terminal.exe .

      # 创建 GitHub Release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: stock-backend/stock-terminal.exe
          generate_release_notes: true
