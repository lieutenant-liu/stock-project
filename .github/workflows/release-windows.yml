name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Job 1: 构建前端（仅一次）──
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        working-directory: stock-frontend
        run: |
          npm ci
          npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: stock-frontend/dist/

  # ── Job 2: 交叉编译（Matrix: Windows + Linux ARM）──
  build-binary:
    needs: build-frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            output: stock-terminal.exe
          - goos: linux
            goarch: arm
            goarm: '7'
            output: stock-terminal-linux-armv7
          - goos: linux
            goarch: arm64
            output: stock-terminal-linux-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist/

      - name: Copy frontend to web/
        run: cp -r frontend-dist/* stock-backend/web/

      - name: Build Go Binary
        working-directory: stock-backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        run: go build -ldflags="-s -w" -o ${{ matrix.output }} .

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.output }}
          path: stock-backend/${{ matrix.output }}

  # ── Job 3: 构建 Android APK（Matrix: armv7 + arm64）──
  build-android:
    needs: build-frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: arm
            goarm: '7'
            apk_arch: armeabi-v7a
            output: StockTerminal-armv7.apk
          - goarch: arm64
            apk_arch: arm64-v8a
            output: StockTerminal-arm64.apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "build-tools;34.0.0" "platforms;android-34"
          yes | sdkmanager --licenses || true

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist/

      - name: Copy frontend to web/ and build Go binary
        working-directory: stock-backend
        env:
          GOOS: android
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        run: |
          cp -r ../frontend-dist/* web/
          go build -ldflags="-s -w" -o stock-terminal .

      - name: Place binary in Android assets
        run: cp stock-backend/stock-terminal stock-android/app/src/main/assets/stock-terminal

      - name: Build APK
        working-directory: stock-android
        run: ./gradlew assembleRelease

      - name: Sign APK with debug key
        run: |
          # 生成 debug keystore
          keytool -genkeypair -v -keystore /tmp/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, S=Debug, C=US"

          # 签名 APK
          APK_IN=$(find stock-android/app/build/outputs/apk/release -name "*.apk" | head -1)
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore /tmp/debug.keystore -storepass android -keypass android \
            "$APK_IN" androiddebugkey

          # zipalign
          ${ANDROID_HOME}/build-tools/34.0.0/zipalign -v 4 "$APK_IN" "${{ matrix.output }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.output }}
          path: ${{ matrix.output }}

  # ── Job 4: 创建 GitHub Release ──
  release:
    needs: [build-binary, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: artifacts/
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
